<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MaoLeaw · Phase 2 Clickable Prototype</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans:['Inter','IBM Plex Sans Thai','sans-serif'], mono:['IBM Plex Mono','monospace'] },
    colors: {
      amber:{50:'#FFFBEB',100:'#FEF3C7',500:'#F59E0B',600:'#D97706',700:'#B45309',800:'#92400E'},
      stone:{50:'#FAFAF9',100:'#F5F5F4',200:'#E7E5E4',300:'#D6D3D1',400:'#A8A29E',500:'#78716C',700:'#44403C',800:'#292524',900:'#1C1917',950:'#0C0A09'},
      sky:{100:'#E0F2FE',500:'#0EA5E9',800:'#075985'},
    },
  }}};
</script>
<style>
  body{font-family:'Inter','IBM Plex Sans Thai',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .phone{width:390px;border-radius:2rem;box-shadow:0 20px 50px rgba(0,0,0,.18);overflow:hidden;}
  .screen{display:none;}
  .screen.active{display:block;}
  .fade{animation:f .25s ease;}
  @keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  button{cursor:pointer;}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important;} }
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#D6D3D1;border-radius:3px}
</style>
</head>
<body class="bg-stone-100 text-stone-900">

<header class="border-b border-stone-200 bg-white sticky top-0 z-20">
  <div class="mx-auto max-w-6xl px-6 py-4 flex items-center gap-3">
    <div class="h-9 w-9 rounded-xl bg-amber-600 grid place-items-center text-white">🍻</div>
    <div class="flex-1">
      <h1 class="font-bold leading-tight">MaoLeaw — Phase 2 Prototype</h1>
      <p class="text-xs text-stone-500">กดได้จริง · mock data · ไม่มี backend</p>
    </div>
    <nav class="flex gap-1 rounded-lg bg-stone-100 p-1 text-sm">
      <button data-view="bot" class="vbtn rounded-md px-3 py-1.5 font-medium bg-white shadow-sm">🤖 Bot</button>
      <button data-view="admin" class="vbtn rounded-md px-3 py-1.5 font-medium text-stone-500">🖥️ Admin</button>
      <button data-view="liff" class="vbtn rounded-md px-3 py-1.5 font-medium text-stone-500">📱 LIFF</button>
    </nav>
  </div>
</header>

<main class="mx-auto max-w-6xl px-6 py-10">

  <!-- ════════════ BOT ════════════ -->
  <section id="view-bot" class="view">
    <p class="mb-4 text-sm text-stone-500">พิมพ์ <b>บิล</b> / <b>งาน</b> / อะไรก็ได้ แล้วกดส่ง — หรือกดปุ่มลัดด้านล่าง</p>
    <div class="phone bg-[#8CABD9] mx-auto">
      <div class="bg-[#1E2A3A] px-4 py-3 text-white text-sm font-medium">‹ MaoLeaw OA</div>
      <div id="chat" class="p-4 space-y-3 overflow-y-auto" style="background:#8CABD9;height:480px;"></div>
      <div class="bg-white border-t border-stone-200 p-2">
        <div class="flex gap-1 mb-2">
          <button onclick="sendCmd('บิล')" class="inline-flex min-h-[44px] items-center rounded-full bg-stone-100 px-4 text-sm">บิล</button>
          <button onclick="sendCmd('งาน')" class="inline-flex min-h-[44px] items-center rounded-full bg-stone-100 px-4 text-sm">งาน</button>
          <button onclick="sendCmd('เมนู')" class="inline-flex min-h-[44px] items-center rounded-full bg-stone-100 px-4 text-sm">เมนู</button>
        </div>
        <form onsubmit="event.preventDefault();sendCmd(document.getElementById('msg').value);document.getElementById('msg').value=''" class="flex gap-2">
          <input id="msg" placeholder="พิมพ์ข้อความ…" class="flex-1 rounded-full border border-stone-200 px-4 py-2 text-sm" />
          <button class="rounded-full bg-amber-600 px-4 text-white text-sm">ส่ง</button>
        </form>
      </div>
    </div>
  </section>

  <!-- ════════════ ADMIN ════════════ -->
  <section id="view-admin" class="view hidden">
    <div class="rounded-2xl border border-stone-200 bg-white p-6 shadow-sm max-w-3xl mx-auto">
      <div class="inline-flex rounded-lg border border-stone-200 bg-stone-50 p-1 mb-6">
        <button id="mode-event" onclick="setMode('event')" class="rounded-md px-4 py-2 text-sm font-medium text-stone-500">
          <span class="block">ผูกกับงาน</span><span class="block text-[11px] font-normal text-stone-400">หารตามคนเข้าร่วม + กติกาเหล้า</span></button>
        <button id="mode-standalone" onclick="setMode('standalone')" class="rounded-md px-4 py-2 text-sm font-medium bg-white shadow-sm text-stone-900">
          <span class="block">บิลทั่วไป</span><span class="block text-[11px] font-normal text-stone-400">เลือกคนเอง · หารเท่ากัน/เฉพาะคน</span></button>
      </div>

      <div class="grid gap-5 sm:grid-cols-2">
        <div><label class="mb-1.5 block text-sm font-medium">ชื่อบิล</label>
          <input id="billName" value="ค่าข้าวเที่ยง" class="w-full rounded-md border border-stone-200 px-3 py-2 text-sm" /></div>
        <div id="eventField" class="hidden"><label class="mb-1.5 block text-sm font-medium">เลือกงาน</label>
          <select class="w-full rounded-md border border-stone-200 px-3 py-2 text-sm"><option>ปาร์ตี้สิ้นเดือน</option><option>เลี้ยงรุ่นน้องจบใหม่</option></select></div>
        <div><label class="mb-1.5 block text-sm font-medium">ช่องทางจ่าย</label>
          <div class="rounded-md border border-stone-200 px-3 py-2 text-sm text-stone-500">PromptPay · 081-234-5678</div></div>
      </div>

      <div id="memberSection" class="mt-5">
        <label class="mb-1.5 block text-sm font-medium">ผู้ร่วมบิล</label>
        <div id="chips" class="flex flex-wrap gap-1.5"></div>
        <button onclick="openPicker()" class="mt-2 inline-flex items-center gap-1 rounded-md border border-stone-200 px-3 py-1.5 text-sm font-medium">+ เลือกสมาชิก (<span id="selCount">0</span>)</button>
      </div>

      <div class="mt-6">
        <p class="mb-2 text-sm font-semibold text-stone-700">รายการ</p>
        <div id="items" class="space-y-2"></div>
        <button onclick="addItem()" class="mt-2 text-sm font-medium text-amber-800">+ เพิ่มรายการ</button>
      </div>

      <div class="mt-6 rounded-lg bg-stone-50 p-4">
        <p class="mb-2 text-sm font-semibold text-stone-700">พรีวิวยอดต่อคน</p>
        <div id="preview" class="grid grid-cols-2 gap-2 text-sm sm:grid-cols-4"></div>
        <div class="mt-3 flex items-center justify-between border-t border-stone-200 pt-3">
          <span class="text-sm text-stone-500">รวมบิล</span><span id="total" class="mono text-lg font-bold text-amber-700">฿0</span></div>
      </div>

      <div class="mt-6 flex justify-end gap-2">
        <button class="rounded-md border border-stone-200 px-4 py-2 text-sm font-medium">ยกเลิก</button>
        <button onclick="createBill()" class="rounded-md bg-amber-600 px-5 py-2 text-sm font-medium text-white">สร้างบิล</button>
      </div>
    </div>
  </section>

  <!-- ════════════ LIFF ════════════ -->
  <section id="view-liff" class="view hidden">
    <div class="phone bg-stone-50 mx-auto">
      <div id="liffHeader" class="bg-white px-4 py-3 border-b border-stone-200 font-bold">ของฉัน</div>
      <div id="liffBody" class="overflow-y-auto" style="height:500px;"></div>
      <div class="grid grid-cols-3 border-t border-stone-200 bg-white text-center text-xs">
        <button onclick="liffGo('home')" class="tab py-2 text-stone-400">🏠<br>หน้าหลัก</button>
        <button onclick="liffGo('bills')" class="tab py-2 text-amber-800 font-medium">🧾<br>ของฉัน</button>
        <button onclick="liffGo('profile')" class="tab py-2 text-stone-400">👤<br>โปรไฟล์</button>
      </div>
    </div>
  </section>
</main>

<!-- toast -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 rounded-lg bg-stone-900 px-4 py-2 text-sm text-white shadow-lg opacity-0 transition pointer-events-none"></div>

<!-- member picker dialog -->
<div id="pickerBg" class="fixed inset-0 z-30 hidden bg-black/40 grid place-items-center p-4">
  <div class="w-full max-w-sm rounded-2xl bg-white p-4 shadow-xl">
    <div class="flex items-center justify-between mb-3"><p class="font-bold">เลือกผู้ร่วมบิล</p><button onclick="closePicker()" class="text-stone-400">✕</button></div>
    <input id="pickSearch" oninput="renderPicker()" placeholder="ค้นหาชื่อ…" class="mb-2 w-full rounded-md border border-stone-200 px-3 py-2 text-sm" />
    <ul id="pickList" class="max-h-72 space-y-1 overflow-y-auto text-sm"></ul>
    <button onclick="closePicker()" class="mt-3 w-full rounded-md bg-amber-600 py-2 text-sm font-medium text-white">เสร็จ</button>
  </div>
</div>

<script>
/* ───── data ───── */
const MEMBERS = [
  {id:'m1',name:'กบ'},{id:'m2',name:'ตูน'},{id:'m3',name:'เอ็ม'},
  {id:'m4',name:'ฟ้า'},{id:'m5',name:'บอล'},{id:'m6',name:'นัท'},
];
const EVENTS = [
  {name:'ปาร์ตี้สิ้นเดือน', date:'30 มิ.ย. 2026 · 19:00 · ร้านลุงหนวด'},
  {name:'เลี้ยงรุ่นน้องจบใหม่', date:'12 ก.ค. 2026 · 18:30 · The Yard'},
];
let myBills = [
  {billId:'b1',name:'ค่าข้าวเที่ยง',amount:300,paymentStatus:'PENDING',eventId:null},
  {billId:'b2',name:'งานปีใหม่ 2026',amount:550,paymentStatus:'CLAIMED',eventId:'e1'},
];

/* ───── view switch ───── */
document.querySelectorAll('.vbtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.vbtn').forEach(x=>{x.classList.remove('bg-white','shadow-sm','text-stone-900');x.classList.add('text-stone-500')});
  b.classList.add('bg-white','shadow-sm','text-stone-900');b.classList.remove('text-stone-500');
  document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
  document.getElementById('view-'+b.dataset.view).classList.remove('hidden');
});

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800);}
const baht=n=>'฿'+n.toLocaleString('th-TH');

/* ───── BOT ───── */
const chat=document.getElementById('chat');
function bubbleUser(text){const d=document.createElement('div');d.className='flex justify-end fade';
  d.innerHTML=`<div class="rounded-2xl rounded-tr-sm bg-[#7DD957] px-3 py-2 text-sm">${text}</div>`;chat.appendChild(d);scroll();}
function bubbleBot(html){const d=document.createElement('div');d.className='flex fade';
  d.innerHTML=`<div class="w-[260px] overflow-hidden rounded-xl bg-white shadow">${html}</div>`;chat.appendChild(d);scroll();}
function scroll(){chat.scrollTop=chat.scrollHeight;}

function debtCard(){
  const total=myBills.filter(b=>b.paymentStatus!=='PAID').reduce((s,b)=>s+b.amount,0);
  if(total===0) return `<div class="px-4 py-4 text-sm">ไม่มียอดค้าง 🎉 สบายตัวไป~</div>`;
  const rows=myBills.map((b,i)=>{
    const st=b.paymentStatus==='CLAIMED'?{t:'รอตรวจสอบ',c:'bg-sky-100 text-sky-800'}:{t:'ยังไม่จ่าย',c:'bg-amber-100 text-amber-800'};
    return `${i?'<hr class="my-2 border-stone-200"/>':''}<div><p class="text-sm font-bold">${b.name}</p>
      <div class="flex items-center justify-between"><span class="inline-block rounded px-2 py-0.5 text-xs ${st.c}">${st.t}</span><span class="text-sm font-bold">${baht(b.amount)} ›</span></div></div>`;
  }).join('');
  return `<div class="bg-stone-800 px-4 py-3"><p class="font-bold text-white">💸 ยอดค้างของคุณ</p></div>
    <div class="px-4 py-3"><div class="flex justify-between"><span class="text-sm text-stone-500">รวมทั้งหมด</span>
      <span class="mono text-xl font-bold text-amber-700">${baht(total)}</span></div>
      <hr class="my-2 border-stone-200"/>${rows}</div>
    <div class="px-3 pb-3"><button onclick="document.querySelector('[data-view=liff]').click()" class="w-full rounded-md bg-amber-600 py-2 text-sm font-medium text-white">เปิดดูใน LIFF</button></div>`;
}
function eventsCard(){
  const rows=EVENTS.map(e=>`<div class="flex justify-between px-4 py-3"><div><p class="text-sm font-bold">${e.name}</p>
    <p class="text-xs text-stone-500">${e.date}</p></div><span class="text-stone-300">›</span></div>`).join('<hr class="border-stone-200"/>');
  return `<div class="bg-stone-800 px-4 py-3"><p class="font-bold text-white">🍻 งานที่จะถึง</p></div>${rows}`;
}
function helpCard(){
  return `<div class="bg-stone-800 px-4 py-3"><p class="font-bold text-white">🍻 MaoLeaw ช่วยอะไรได้บ้าง</p></div>
    <div class="px-4 py-3 space-y-2 text-sm"><p><span class="rounded bg-stone-100 px-1.5 py-0.5 font-medium">บิล</span> → ดูยอดค้าง</p>
    <p><span class="rounded bg-stone-100 px-1.5 py-0.5 font-medium">งาน</span> → งานที่จะถึง</p></div>`;
}
function resolveIntent(t){t=t.trim().toLowerCase();
  if(/บิล|ค้าง|จ่าย|หนี้|bill/.test(t))return 'debt';
  if(/งาน|อีเวนต์|event|นัด/.test(t))return 'events';
  return 'help';}
function sendCmd(text){if(!text||!text.trim())return;bubbleUser(text);
  setTimeout(()=>{const i=resolveIntent(text);bubbleBot(i==='debt'?debtCard():i==='events'?eventsCard():helpCard());},350);}
// greeting
bubbleBot(helpCard());

/* ───── ADMIN ───── */
let mode='standalone';
let selected=new Set(['m1','m2','m3','m4']);
let items=[{type:'SHARED',name:'หมูกระทะ',price:600},{type:'CUSTOM',name:'ชาเย็น',price:80,who:new Set(['m1','m4'])}];

function setMode(m){mode=m;
  document.getElementById('mode-event').className='rounded-md px-4 py-2 text-sm font-medium '+(m==='event'?'bg-white shadow-sm text-stone-900':'text-stone-500');
  document.getElementById('mode-standalone').className='rounded-md px-4 py-2 text-sm font-medium '+(m==='standalone'?'bg-white shadow-sm text-stone-900':'text-stone-500');
  document.getElementById('eventField').classList.toggle('hidden',m!=='event');
  document.getElementById('memberSection').classList.toggle('hidden',m==='event');
  renderItems();renderPreview();
}
function renderChips(){
  document.getElementById('selCount').textContent=selected.size;
  const c=document.getElementById('chips');
  if(selected.size===0){c.innerHTML='<span class="text-sm text-stone-400">ยังไม่ได้เลือกสมาชิก</span>';return;}
  c.innerHTML=[...selected].map(id=>{const m=MEMBERS.find(x=>x.id===id);
    return `<span class="inline-flex items-center gap-1 rounded-full bg-amber-50 py-1 pl-3 pr-1 text-xs font-medium text-amber-800">${m.name}
      <button onclick="toggleMember('${id}')" aria-label="ลบ ${m.name}" class="grid h-6 w-6 place-items-center rounded-full hover:bg-amber-100">✕</button></span>`;}).join('');
}
function toggleMember(id){selected.has(id)?selected.delete(id):selected.add(id);
  items.forEach(it=>it.who&&it.who.delete&&!selected.has(id)&&it.who.delete(id));
  renderChips();renderPicker();renderItems();renderPreview();}
function openPicker(){document.getElementById('pickerBg').classList.remove('hidden');renderPicker();}
function closePicker(){document.getElementById('pickerBg').classList.add('hidden');}
function renderPicker(){
  const q=(document.getElementById('pickSearch').value||'').toLowerCase();
  document.getElementById('pickList').innerHTML=MEMBERS.filter(m=>m.name.toLowerCase().includes(q)).map(m=>{
    const on=selected.has(m.id);
    return `<li><button onclick="toggleMember('${m.id}')" class="flex w-full items-center gap-3 rounded-md px-2 py-2 text-left ${on?'bg-amber-50':'hover:bg-stone-50'}">
      <span class="grid h-8 w-8 place-items-center rounded-full bg-stone-200">${m.name[0]}</span>
      <span class="flex-1">${m.name}</span>${on?'<span class="text-amber-800">✓</span>':''}</button></li>`;}).join('');
}
function renderItems(){
  const standalone=mode==='standalone';
  document.getElementById('items').innerHTML=items.map((it,idx)=>{
    const typeOpts=(standalone?['SHARED','CUSTOM']:['SHARED','LIQUOR','BEER','MIXER','CUSTOM'])
      .map(t=>`<option value="${t}" ${it.type===t?'selected':''}>${({SHARED:'หารทุกคน',CUSTOM:'เลือกเอง',LIQUOR:'เหล้า',BEER:'เบียร์',MIXER:'มิกเซอร์'})[t]}</option>`).join('');
    const custom=it.type==='CUSTOM'?`<div class="mt-2 flex flex-wrap gap-1">${[...selected].map(id=>{const m=MEMBERS.find(x=>x.id===id);const on=it.who&&it.who.has(id);
      return `<button onclick="toggleWho(${idx},'${id}')" class="rounded-full px-2 py-0.5 text-xs ${on?'bg-amber-600 text-white':'bg-stone-100 text-stone-600'}">${m.name}</button>`;}).join('')}</div>`:'';
    return `<div class="rounded-lg border border-stone-200 p-3">
      <div class="flex items-center gap-3">
        <select onchange="setType(${idx},this.value)" class="rounded-md border border-stone-200 px-2 py-1.5 text-sm">${typeOpts}</select>
        <input value="${it.name}" oninput="items[${idx}].name=this.value" class="flex-1 rounded-md border border-stone-200 px-3 py-1.5 text-sm" />
        <input value="${it.price}" oninput="items[${idx}].price=+this.value||0;renderPreview()" class="w-24 rounded-md border border-stone-200 px-3 py-1.5 text-sm mono text-right" />
        <button onclick="items.splice(${idx},1);renderItems();renderPreview()" class="text-stone-400">🗑</button>
      </div>${custom}</div>`;
  }).join('');
}
function setType(idx,t){items[idx].type=t;if(t==='CUSTOM'&&!items[idx].who)items[idx].who=new Set([...selected].slice(0,1));renderItems();renderPreview();}
function toggleWho(idx,id){const w=items[idx].who||(items[idx].who=new Set());w.has(id)?w.delete(id):w.add(id);renderItems();renderPreview();}
function addItem(){items.push({type:'SHARED',name:'',price:0});renderItems();}
function renderPreview(){
  const ids=[...selected];const tally={};ids.forEach(id=>tally[id]=0);
  items.forEach(it=>{const grp=it.type==='CUSTOM'?[...(it.who||[])]:ids;
    if(grp.length){const per=Math.ceil((it.price||0)/grp.length);grp.forEach(id=>tally[id]+=per);}});
  document.getElementById('preview').innerHTML=ids.map(id=>{const m=MEMBERS.find(x=>x.id===id);
    return `<div class="rounded-md bg-white p-2 text-center"><p class="text-stone-500">${m.name}</p><p class="mono font-bold">${baht(tally[id])}</p></div>`;}).join('');
  document.getElementById('total').textContent=baht(items.reduce((s,it)=>s+(it.price||0),0));
}
function createBill(){
  if(mode==='standalone'&&selected.size===0)return toast('ต้องเลือกผู้ร่วมบิลอย่างน้อย 1 คน');
  if(items.length===0||!document.getElementById('billName').value.trim())return toast('กรอกชื่อบิล + รายการ');
  const name=document.getElementById('billName').value;
  const amount=Math.ceil(items.reduce((s,it)=>s+(it.price||0),0)/selected.size);
  myBills.unshift({billId:'new'+Date.now(),name,amount,paymentStatus:'PENDING',eventId:mode==='event'?'e1':null});
  toast('สร้างบิล "'+name+'" แล้ว ✓ (ดูใน LIFF › ของฉัน)');
}

/* ───── LIFF ───── */
let liffScreen='bills';
function liffGo(s){liffScreen=s;renderLiff();}
function renderLiff(){
  const h=document.getElementById('liffHeader'),b=document.getElementById('liffBody');
  if(liffScreen==='home'){h.textContent='หน้าหลัก';
    b.innerHTML=`<div class="p-4 space-y-2">${EVENTS.map(e=>`<div class="rounded-xl border border-stone-200 bg-white p-3"><p class="font-medium">${e.name}</p><p class="text-xs text-stone-500">${e.date}</p></div>`).join('')}</div>`;return;}
  if(liffScreen==='profile'){h.textContent='โปรไฟล์';
    b.innerHTML=`<div class="p-4 text-center"><div class="mx-auto mb-3 grid h-20 w-20 place-items-center rounded-full bg-stone-200 text-2xl">ก</div><p class="font-bold">กบ</p><p class="text-sm text-stone-500">เด็ก BD · เหล้า 🥃</p></div>`;return;}
  if(liffScreen.startsWith('bill:')){const id=liffScreen.slice(5);const bill=myBills.find(x=>x.billId===id);h.innerHTML='<button onclick="liffGo(\'bills\')">‹ บิล</button>';
    b.innerHTML=`<div class="p-4 space-y-4">
      <div class="rounded-xl border border-stone-200 bg-white p-5 text-center"><div class="mb-2 text-3xl">${bill.eventId?'📅':'🧾'}</div>
        <p class="font-bold text-lg">${bill.name}</p><p class="mt-3 text-sm text-stone-500">ยอดของคุณ</p>
        <p class="mono text-4xl font-bold text-amber-700">${baht(bill.amount)}</p>
        <p class="mt-2"><span class="inline-block rounded px-2 py-0.5 text-xs ${bill.paymentStatus==='CLAIMED'?'bg-sky-100 text-sky-800':'bg-amber-100 text-amber-800'}">${bill.paymentStatus==='CLAIMED'?'รอตรวจสอบ':'ยังไม่จ่าย'}</span></p></div>
      <div class="rounded-xl border border-stone-200 bg-white p-5 text-center"><p class="mb-3 text-sm font-medium text-stone-500">สแกนเพื่อจ่าย (PromptPay)</p>
        <div class="mx-auto grid h-40 w-40 place-items-center rounded-lg bg-stone-100 text-stone-400">QR Code</div><p class="mt-3 mono text-sm">081-234-5678</p></div>
      ${bill.paymentStatus==='PENDING'?`<button onclick="claim('${id}')" class="w-full rounded-xl bg-amber-600 py-3 font-medium text-white">ฉันโอนแล้ว 📸</button>`:`<div class="rounded-xl bg-sky-100 py-3 text-center text-sm font-medium text-sky-800">✓ แจ้งโอนแล้ว รอแอดมินตรวจสอบ</div>`}</div>`;
    return;}
  // bills list
  h.textContent='ของฉัน';
  const total=myBills.filter(x=>x.paymentStatus!=='PAID').reduce((s,x)=>s+x.amount,0);
  if(myBills.length===0){b.innerHTML=`<div class="grid place-items-center p-8 text-center" style="height:100%"><div><div class="mb-3 text-5xl">🎉</div><p class="font-bold">ไม่มียอดค้าง</p><p class="mt-1 text-sm text-stone-500">จ่ายครบทุกบิลแล้ว</p></div></div>`;return;}
  b.innerHTML=`<div class="p-4 space-y-3">
    <div class="rounded-xl bg-stone-800 p-4 text-white"><p class="text-sm text-stone-300">ยอดค้างจ่ายรวม</p><p class="mono text-3xl font-bold text-amber-500">${baht(total)}</p></div>
    ${myBills.map(x=>{const st=x.paymentStatus==='CLAIMED'?{t:'รอตรวจสอบ',c:'bg-sky-100 text-sky-800'}:{t:'ยังไม่จ่าย',c:'bg-amber-100 text-amber-800'};
      return `<button onclick="liffGo('bill:${x.billId}')" class="flex w-full items-center gap-3 rounded-xl border border-stone-200 bg-white p-3 text-left">
        <span class="grid h-10 w-10 place-items-center rounded-full bg-stone-100 text-stone-500">${x.eventId?'📅':'🧾'}</span>
        <span class="min-w-0 flex-1"><span class="block truncate font-medium">${x.name}</span><span class="mt-0.5 inline-block rounded px-2 py-0.5 text-xs ${st.c}">${st.t}</span></span>
        <span class="mono font-bold">${baht(x.amount)}</span><span class="text-stone-300">›</span></button>`;}).join('')}</div>`;
}
function claim(id){const b=myBills.find(x=>x.billId===id);b.paymentStatus='CLAIMED';toast('แจ้งโอนแล้ว ✓');liffGo('bill:'+id);}

/* init */
renderChips();renderItems();renderPreview();renderLiff();
</script>
</body>
</html>
