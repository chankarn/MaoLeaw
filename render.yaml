services:
  - type: web
    name: maoleaw-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Bangkok
      - key: PORT
        value: 4000
      # Set the following in the Render dashboard (not committed here)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_MESSAGING_TOKEN
        sync: false
      - key: LINE_MESSAGING_SECRET
        sync: false
      - key: LIFF_ID
        sync: false
      - key: PROMPTPAY_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SLIPOK_API_KEY
        sync: false
      - key: SLIPOK_BRANCH_ID
        sync: false
      - key: SLIPOK_MONTHLY_LIMIT
        value: 100
      - key: AUTO_REMIND_DAYS
        value: 3
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
