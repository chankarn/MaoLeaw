# File: .github/workflows/keep-warm.yml
# Ping Render API every ~12 min to prevent free-tier spin-down (15 min idle).
name: Keep API Warm

on:
  schedule:
    # Every 12 minutes
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /v1/health
        run: |
          if [ -z "${{ secrets.API_URL }}" ]; then
            echo "::error::API_URL secret not set"
            exit 1
          fi
          status=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 60 "${{ secrets.API_URL }}/v1/health")
          echo "HTTP $status"
          cat /tmp/body
          if [ "$status" != "200" ]; then
            echo "::warning::Health check returned non-200"
            exit 1
          fi
