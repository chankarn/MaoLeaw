# File: .github/workflows/keep-warm.yml
# Keeps the free tiers alive:
#   - Render spins the API down after 15 min idle → ping it, but only during party
#     hours: 17:00–02:00 Bangkok (10:00–19:00 UTC). Staying up 24/7 burns ~744 of the
#     750 free instance hours a month; evenings only is ~290. Outside that window the
#     first request (LIFF open or a bot message) waits for a ~50s cold start.
#   - Supabase pauses the project after 7 days without DB activity → the ping must
#     actually query the DB (/v1/health/db runs SELECT 1; plain /v1/health does not).
#     The daily evening pings are plenty for that.
# GitHub disables scheduled workflows in public repos after 60 days without repo
# activity, so the last step re-enables this workflow through the API each run.
name: Keep API Warm

on:
  schedule:
    - cron: '*/12 10-18 * * *' # UTC → every ~12 min, 17:00–01:59 Asia/Bangkok
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping /v1/health/db (wakes Render + touches Supabase)
        id: api
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.API_URL }}" ]; then
            echo "::error::API_URL secret not set"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            status=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 90 "${{ secrets.API_URL }}/v1/health/db")
            echo "HTTP $status"
            cat /tmp/body
            if [ "$status" = "200" ]; then
              echo "OK"
              exit 0
            fi
            echo "Non-200, waiting 30s before retry..."
            sleep 30
          done
          echo "::error::Health check failed after 3 attempts"
          exit 1

      # Fallback so Supabase stays active even when Render is down.
      # Optional: set the DATABASE_URL secret to enable it.
      - name: Direct DB ping (fallback)
        if: steps.api.outcome != 'success'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret not set — skipping direct DB ping"
            exit 0
          fi
          psql "${DATABASE_URL%%\?*}" -tAc 'SELECT 1'

      - name: Keep this schedule from being disabled for inactivity
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-warm.yml/enable"

      - name: Fail if API ping failed
        if: steps.api.outcome != 'success'
        run: exit 1
