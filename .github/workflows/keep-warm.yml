# File: .github/workflows/keep-warm.yml
# Ping Render API every ~12 min to prevent free-tier spin-down (15 min idle).
name: Keep API Warm

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /v1/health (with retry for cold start)
        run: |
          if [ -z "${{ secrets.API_URL }}" ]; then
            echo "::error::API_URL secret not set"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            status=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 90 "${{ secrets.API_URL }}/v1/health")
            echo "HTTP $status"
            cat /tmp/body
            if [ "$status" = "200" ]; then
              echo "OK"
              exit 0
            fi
            echo "Non-200, waiting 30s before retry..."
            sleep 30
          done
          echo "::error::Health check failed after 3 attempts"
          exit 1
